<title>青山巨城店 盤點表</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>
:root{
  --bg:#f3ecdc;--card:#fcf9f1;--ink:#22332c;--muted:#75806f;--line:#e1d7bd;
  --accent:#3f6b5a;--accent-ink:#fff;--accent-soft:#dde8df;--sun:#c4581f;--warn:#b4570a;--warn-soft:#f8e6d2;
  --up:#3f6b5a;--down:#c0392b;--input:#f8f3e6;
}
@media (prefers-color-scheme:dark){:root{
  --bg:#141d18;--card:#1c2822;--ink:#ece8da;--muted:#94a394;--line:#2b3a32;
  --accent:#7fb59d;--accent-ink:#0f1c16;--accent-soft:#263b32;--sun:#e58a55;--warn:#f0a35a;--warn-soft:#3a2a17;
  --up:#7fb59d;--down:#ff8a7a;--input:#17211c}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:-apple-system,"PingFang TC","Noto Sans TC","Microsoft JhengHei",system-ui,sans-serif;font-size:16px;line-height:1.45;
  padding-bottom:calc(72px + env(safe-area-inset-bottom,0px))}
button{font:inherit;color:inherit;cursor:pointer}
input,select{font:inherit;font-size:16px;color:var(--ink);background:var(--input);border:1px solid var(--line);border-radius:10px;padding:10px 12px;min-width:0;width:100%}
input:focus{outline:2px solid var(--accent);outline-offset:-1px}
.hidden{display:none!important}
.wrap{max-width:720px;margin:0 auto}

/* 頂部固定區 */
.top{position:sticky;top:0;z-index:10;background:var(--bg);padding:calc(8px + env(safe-area-inset-top,0px)) 12px 8px;border-bottom:1px solid var(--line)}
.bar{display:flex;align-items:center;gap:8px;margin-bottom:8px}
.logo{height:38px;width:auto;flex:none}
.ttl{font-weight:800;font-size:17px;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--accent);line-height:1.15}
.ttl small{display:block;font-size:11px;font-weight:600;color:var(--sun);letter-spacing:.08em}
.top{border-bottom:3px solid var(--accent)}
details.sync summary{font-weight:800;font-size:16px;cursor:pointer;list-style:none;display:flex;justify-content:space-between;align-items:center}
details.sync summary::-webkit-details-marker{display:none}
details.sync summary::after{content:"▾";color:var(--muted)}
details.sync[open] summary::after{content:"▴"}
details.sync .body{margin-top:12px}
.pill{font-size:12px;padding:3px 10px;border-radius:99px;background:var(--accent-soft);color:var(--accent);font-weight:700;white-space:nowrap}
.pill.warn{background:var(--warn-soft);color:var(--warn)}
.datenav{display:flex;align-items:center;gap:6px;margin-bottom:8px}
.nb{width:44px;height:44px;border-radius:12px;border:1px solid var(--line);background:var(--card);font-size:18px;flex:none}
.dwrap{flex:1;position:relative;height:44px;border:1px solid var(--line);border-radius:12px;background:var(--card);display:flex;align-items:center;justify-content:center;font-weight:800;font-size:17px}
.dwrap input{position:absolute;inset:0;opacity:0;width:100%;height:100%;padding:0;border:0}
.todaybtn{height:44px;padding:0 12px;border-radius:12px;border:1px solid var(--accent);background:var(--accent);color:var(--accent-ink);font-weight:700;flex:none}
.toolrow{display:flex;gap:6px;align-items:center;margin-bottom:8px}
.search{position:relative;flex:1;min-width:0;max-width:150px}
.btn.sm{min-height:34px;padding:0 10px;font-size:14px;border-radius:10px;flex:none;white-space:nowrap}
.search input{height:34px;font-size:15px;padding:0 26px 0 30px;border-radius:10px;background:var(--card)}
.search .ic{font-size:13px;position:absolute;left:9px;top:50%;transform:translateY(-50%);color:var(--muted);pointer-events:none}
.search .x{position:absolute;right:4px;top:50%;transform:translateY(-50%);width:28px;height:34px;border:0;background:none;color:var(--muted);font-size:15px}
.chips{display:flex;gap:8px;overflow-x:auto;padding-bottom:2px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;border:1px solid var(--line);background:var(--card);border-radius:99px;padding:8px 14px;font-weight:700;font-size:15px;white-space:nowrap}
.chip small{font-weight:600;color:var(--muted);margin-left:4px}
.chip.on{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.prog i{background:linear-gradient(90deg,var(--accent),var(--sun))!important}
.chip.on small{color:var(--accent-ink);opacity:.85}
.prog{height:4px;background:var(--line);border-radius:4px;margin-top:8px;overflow:hidden}
.prog i{display:block;height:100%;width:0;background:var(--accent);transition:width .3s}

/* 品項卡片 */
.list{padding:10px 12px}
.meta{background:var(--card);border:1px solid var(--line);border-radius:14px;margin-bottom:10px}
.meta summary{padding:12px 14px;font-weight:700;cursor:pointer;list-style:none;display:flex;justify-content:space-between;color:var(--muted)}
.meta summary::-webkit-details-marker{display:none}
.meta .in{padding:0 14px 14px;display:grid;gap:8px}
.metarow{display:flex;align-items:center;gap:10px;padding:8px 10px 8px 14px}
.metarow .mi{font-weight:700;white-space:nowrap;flex:none}
.metarow input{flex:none;width:130px;min-width:0;height:36px;font-size:15px;padding:0 12px;border-radius:10px}
.item{display:flex;align-items:center;gap:10px;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:10px 10px 10px 14px;margin-bottom:8px}
.item{position:relative;overflow:hidden}
.item.filled{border:2px solid var(--flash);padding:9px 9px 9px 13px}
.info{flex:1;min-width:0}
.nm{font-weight:800;font-size:17px;overflow-wrap:anywhere}
.nm .muted{color:#e07b1a;font-weight:700}
.cat{font-size:11px;font-weight:700;color:var(--muted);border:1px solid var(--line);border-radius:6px;padding:0 6px;margin-left:6px;vertical-align:2px}
.sub{font-size:13px;color:var(--muted);margin-top:2px}
.diff{font-weight:800}.diff.up{color:var(--up)}.diff.down{color:var(--down)}
.stp{display:flex;align-items:center;gap:6px;flex:none}
.sb{width:44px;height:48px;border-radius:12px;border:1px solid var(--line);background:var(--input);font-size:22px;font-weight:700;line-height:1}
.sb:active{background:var(--accent-soft)}
.qty{width:74px;height:48px;text-align:center;font-size:22px;font-weight:800;padding:0 4px;border-radius:12px}
@keyframes fl{from{background:var(--flash-soft);box-shadow:0 0 0 3px var(--flash)}to{background:var(--input);box-shadow:none}}
.qty.flash{animation:fl 1.6s ease-out}
.empty{text-align:center;color:var(--muted);padding:30px 10px}

/* 通用卡片 */
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;margin:10px 12px}
.card h2{font-size:16px;margin:0 0 10px}
.muted{color:var(--muted);font-size:13px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.btn{border:1px solid var(--line);background:var(--card);border-radius:12px;padding:11px 14px;font-weight:700;min-height:44px}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.danger{color:var(--down)}
.btn:disabled{opacity:.5}
.field{display:block;margin-bottom:10px}.field span{display:block;font-size:12px;color:var(--muted);margin-bottom:3px}
.scroll{overflow-x:auto;-webkit-overflow-scrolling:touch}
table{border-collapse:collapse;width:100%;font-size:14px}
th,td{padding:7px 8px;border-bottom:1px solid var(--line);text-align:right;white-space:nowrap}
th{color:var(--muted);font-size:12px;position:sticky;top:0;background:var(--card)}
th:nth-child(-n+3),td:nth-child(-n+3){text-align:left}
td.day{font-weight:800;color:#8a5a00;cursor:pointer}
tr.has td{background:#fbeaa0}
tr.cur td{outline:0;box-shadow:inset 0 2px 0 #e0a800,inset 0 -2px 0 #e0a800}
tr.cur td:first-child{box-shadow:inset 0 2px 0 #e0a800,inset 0 -2px 0 #e0a800,inset 2px 0 0 #e0a800}
tr.cur td:last-child{box-shadow:inset 0 2px 0 #e0a800,inset 0 -2px 0 #e0a800,inset -2px 0 0 #e0a800}
.irow{display:grid;grid-template-columns:1fr 70px;gap:6px;margin-bottom:6px}
.irow2{display:grid;gap:6px;margin-bottom:12px;padding-bottom:12px;border-bottom:1px dashed var(--line)}
.brow{display:flex;gap:6px;justify-content:flex-end}
.ib{width:42px;height:42px;border-radius:10px;border:1px solid var(--line);background:var(--input)}

/* 底部導覽 */
.nav{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--card);border-top:1px solid var(--line);display:flex;padding-bottom:env(safe-area-inset-bottom,0px)}
.nav button{flex:1;border:0;background:none;padding:9px 0 8px;font-size:12px;font-weight:700;color:var(--muted);display:flex;flex-direction:column;align-items:center;gap:1px}
.nav button b{margin-bottom:2px}
.nav button.on{color:var(--accent)}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(84px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:99px;font-size:14px;z-index:30;opacity:0;pointer-events:none;transition:opacity .2s;max-width:92%;text-align:center}
.toast.show{opacity:1}
.banner{background:var(--warn-soft);color:var(--warn);padding:10px 12px;font-size:14px;margin:10px 12px 0;border-radius:12px}
.nic{width:26px;height:26px;display:block;margin-bottom:2px}
.nav button .nic.a{display:none}.nav button.on .nic.a{display:block}.nav button.on .nic.g{display:none}
.ib.arm{background:var(--down)!important;border-color:var(--down)!important;color:#fff!important;font-size:13px;font-weight:800;white-space:nowrap;padding:0;letter-spacing:0}
tr.has td,tr.has td.day{background:#fbeaa0!important;color:#3d3208}
td.day{text-align:center!important}
#histTable th:nth-child(n+4),#histTable td:nth-child(n+4){text-align:center}
#histTable th:nth-child(-n+3),#histTable td:nth-child(-n+3){text-align:center}
@media (prefers-color-scheme:dark){tr.has td{background:#5a4c12!important;color:#fff3c2;border-bottom-color:#8a7420}td.day{color:#f5d76e}}
.avatar{width:26px;height:26px;border-radius:50%;object-fit:cover;vertical-align:middle;margin-right:8px;border:1px solid var(--line)}
.mi{display:flex;align-items:center;color:var(--ink)}
:root{--flash:#2f7fd6;--flash-soft:#dbeafe}
@media (prefers-color-scheme:dark){:root{--flash:#5aa2ff;--flash-soft:#1f3a5c}}
</style>
</head>
<body>
<div class="wrap">

<!-- ================= 盤點頁 ================= -->

<script>
/* ============================================================
   ★ 同步設定：把 Firebase Realtime Database 網址與店家代碼填在這裡，
     所有人打開網頁就會自動連線（不用各自設定）。
     不填也可以，之後到網頁「設定」頁輸入。
   ============================================================ */
const CONFIG = {
  dbUrl: "https://peaktea-bigcity-default-rtdb.asia-southeast1.firebasedatabase.app",   // 例："https://peaktea-xxxx-default-rtdb.asia-southeast1.firebasedatabase.app"
  code:  "peaktea-bigcity-2025"    // 例："peaktea-bigcity-2026"
};

(function(){
const WD=['日','一','二','三','四','五','六'];
const DEFAULT_CATS=['粉','配料','原料','包裝','發票','其他'];
const RAW=[
 ['熟飲杯蓋','包裝'],['冷飲杯蓋','包裝'],['熟飲杯套','包裝'],['號印珍珠','配料'],['養樂珍珠','配料'],
 ['奶精粉','粉'],['粉粿粉','粉'],['豆黃粉','粉'],['果凍粉','粉'],['杏仁凍粉','粉'],['仙草粉','粉'],
 ['冬瓜醬罐','原料'],['蔗茶','原料'],['荔枝原汁','原料'],['發票紙捲','發票'],['品項貼','發票'],
 ['餐巾紙','包裝'],['餅乾','其他'],['自訂欄1','其他'],['自訂欄2','其他'],['自訂欄3','其他'],['New 大杯 / New 中杯','包裝']];
const DEFAULT_ITEMS=RAW.map((r,i)=>({id:'i'+(i+1),name:r[0],unit:'',cat:r[1]}));
const pad=n=>String(n).padStart(2,'0');
const ymd=d=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
const parse=s=>{const [y,m,d]=s.split('-').map(Number);return new Date(y,m-1,d)};
const $=id=>document.getElementById(id);
const clone=o=>JSON.parse(JSON.stringify(o));
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function toast(m){const t=$('toast');t.textContent=m;t.classList.add('show');clearTimeout(toast.h);toast.h=setTimeout(()=>t.classList.remove('show'),2400)}
const hasVal=v=>(typeof v==='number'&&isFinite(v))||(typeof v==='string'&&v.trim()!==''&&isFinite(Number(v)));
const BOOT_AT=Date.now();

/* ---------- 狀態 ---------- */
let S={items:clone(DEFAULT_ITEMS),nextId:100,days:{}};
let todayStr=ymd(new Date()),curDate=todayStr,histMonth=todayStr.slice(0,7);
let catSel='全部',query='';
let store=null,online=true,connected=false;
const pendVals={};      // key -> 尚未被雲端確認的值
let busy=0,lastSync='';

/* ---------- 設定 ---------- */
function getCfg(){
  let sv={};try{sv=JSON.parse(localStorage.getItem('pt_cfg')||'{}')}catch(e){}
  return {dbUrl:(CONFIG.dbUrl||sv.dbUrl||'').trim(),code:(CONFIG.code||sv.code||'').trim()};
}
const cleanCode=c=>c.replace(/[.$#\[\]\/\s]/g,'_');

/* ---------- 儲存層 ---------- */
function makeLocalStore(){
  const K='pt_local_v1';let st;try{st=JSON.parse(localStorage.getItem(K))}catch(e){}
  st=st&&st.days?st:{days:{},itemsJson:null};
  let cbD,cbI;const save=()=>{try{localStorage.setItem(K,JSON.stringify(st))}catch(e){}};
  const fire=()=>{cbD&&cbD(clone(st.days));cbI&&cbI(st.itemsJson)};
  return {kind:'local',
    subscribe(d,i){cbD=d;cbI=i;fire()},
    async setField(date,path,v){
      const day=st.days[date]||(st.days[date]={});
      const parts=path.split('/');let o=day;
      for(let i=0;i<parts.length-1;i++)o=o[parts[i]]||(o[parts[i]]={});
      const k=parts[parts.length-1];if(v===null||v===undefined||v==='')delete o[k];else o[k]=v;
      day.updatedAt=Date.now();save();fire()},
    async setDay(date,obj){if(obj)st.days[date]=obj;else delete st.days[date];save();fire()},
    async setItems(json){st.itemsJson=json;save();fire()}};
}
function loadScript(src){return new Promise((res,rej)=>{const s=document.createElement('script');s.src=src;s.onload=res;s.onerror=()=>rej(new Error('載入失敗'));document.head.appendChild(s)})}
async function makeCloudStore(url,code){
  const V='10.12.2';
  await loadScript('https://www.gstatic.com/firebasejs/'+V+'/firebase-app-compat.js');
  await loadScript('https://www.gstatic.com/firebasejs/'+V+'/firebase-database-compat.js');
  const app=firebase.initializeApp({databaseURL:url});
  const db=firebase.database(app);
  const base=db.ref('stores/'+cleanCode(code));
  db.ref('.info/connected').on('value',s=>{connected=!!s.val();setStatus()});
  return {kind:'cloud',
    subscribe(d,i,err){
      base.child('days').on('value',s=>d(s.val()||{}),err);
      base.child('itemsJson').on('value',s=>i(s.val()),err);
    },
    setField(date,path,v){
      const u={};u['days/'+date+'/'+path]=(v===''||v===undefined)?null:v;u['days/'+date+'/updatedAt']=firebase.database.ServerValue.TIMESTAMP;
      return base.update(u)},
    setDay(date,obj){return base.child('days/'+date).set(obj||null)},
    setItems(json){return base.child('itemsJson').set(json)}};
}

/* ---------- 資料存取 ---------- */
function dayOf(d){return S.days[d]||(S.days[d]={})}
function valOf(d,id){const x=S.days[d];return x&&x.values?x.values[id]:undefined}
function hasData(r){return r&&r.values&&Object.values(r.values).some(hasVal)}
function prevRecord(date){
  const ds=Object.keys(S.days).filter(d=>d<date&&hasData(S.days[d])).sort();
  return ds.length?{date:ds[ds.length-1],rec:S.days[ds[ds.length-1]]}:null;
}
function applyPending(){
  for(const k in pendVals){
    const [d,p]=k.split('|');const day=dayOf(d);
    const v=pendVals[k];
    if(p.startsWith('v:')){const id=p.slice(2);day.values=day.values||{};if(hasVal(v))day.values[id]=v;else delete day.values[id]}
    else{day[p]=v}
  }
}

/* ---------- 自動儲存（每個欄位 0.4 秒合併一次） ---------- */
const timers={};
function writeField(date,kind,id,v){ // kind: 'v' 數量 / 'm' staff,note
  const path=kind==='v'?'values/'+id:id;
  const key=date+'|'+(kind==='v'?'v:'+id:id);
  pendVals[key]=v;
  clearTimeout(timers[key]);setStatus();
  timers[key]=setTimeout(async()=>{
    const sent=pendVals[key];busy++;setStatus();
    try{
      await store.setField(date,path,sent);
      lastSync=new Date().toLocaleTimeString('zh-TW',{hour:'2-digit',minute:'2-digit'});
      if(pendVals[key]===sent)delete pendVals[key];
    }catch(e){toast('儲存失敗，稍後自動重試');timers[key]=setTimeout(()=>writeField(date,kind,id,pendVals[key]),3000)}
    finally{busy--;setStatus()}
  },400);
}
function setStatus(){
  const p=$('livePill');const pending=busy>0||Object.keys(pendVals).length>0;
  if(!store){p.textContent='連線中…';p.className='pill warn';return}
  if(store.kind==='local'){p.textContent='本機模式';p.className='pill warn';return}
  if(!connected){p.textContent='🔴 離線（恢復後自動同步）';p.className='pill warn';return}
  p.textContent=pending?'⏳ 儲存中…':'🟢 已同步'+(lastSync?' '+lastSync:'');p.className='pill'+(pending?' warn':'');
}

function cats(){

function renderChips(){

function visible(it){

  else if(catSel!=='全部'&&(it.cat||'')!==catSel)return false;

/* ---------- 品項卡片 ---------- */
function flashEl(el){el.classList.remove('flash');void el.offsetWidth;el.classList.add('flash')}
let cards={};
function diffOf(id){
  const p=prevRecord(curDate),c=valOf(curDate,id),pv=p?p.rec.values&&p.rec.values[id]:undefined;
  if(!hasVal(c)||!hasVal(pv))return{t:'',c:''};
  const d=Math.round((Number(c)-Number(pv))*100)/100;
  return{t:(d>0?'+':'')+d,c:d>0?'up':d<0?'down':''};
}
function renderItems(){
  const box=$('items');box.innerHTML='';cards={};
  const list=S.items.filter(i=>i.name).filter(visible);
  if(!list.length){box.innerHTML='<div class="empty">'+(S.items.length?'沒有符合的品項':'尚無品項，請到「設定」新增')+'</div>';return}
  list.forEach(it=>{
    const el=document.createElement('div');el.className='item';
    el.innerHTML='<div class="info"><div class="nm"></div><div class="sub"></div></div><div class="stp"><button class="sb" aria-label="減一">−</button><input class="qty" type="number" inputmode="decimal" step="any" min="0" placeholder="—"><button class="sb" aria-label="加一">＋</button></div>';
    el.querySelector('.nm').innerHTML=esc(it.name)+(it.unit?' <span class="muted">('+esc(it.unit)+')</span>':'')+(it.cat?'<span class="cat">'+esc(it.cat)+'</span>':'');
    const inp=el.querySelector('input'),[m,p]=el.querySelectorAll('.sb');
    const commit=raw=>{
      const v=raw===''?'':Number(raw);if(v!==''&&isNaN(v))return;
      const day=dayOf(curDate);day.values=day.values||{};if(hasVal(v))day.values[it.id]=v;else delete day.values[it.id];
      writeField(curDate,'v',it.id,v);flashEl(inp);
      refreshCard(it.id);renderChips();updateProg();
    };
    inp.addEventListener('input',()=>commit(inp.value));
    inp.addEventListener('focus',()=>inp.select());
    inp.addEventListener('keydown',e=>{if(e.key==='Enter'){e.preventDefault();const all=[...box.querySelectorAll('input.qty')];const nx=all[all.indexOf(inp)+1];if(nx)nx.focus();else inp.blur()}});
    const bump=d=>{const cur=inp.value===''?0:Number(inp.value);const n=Math.max(0,Math.round((cur+d)*100)/100);inp.value=n;commit(String(n))};
    m.onclick=()=>bump(-1);p.onclick=()=>bump(1);
    box.appendChild(el);cards[it.id]={el,inp};refreshCard(it.id,true);
  });
}
function refreshCard(id,force){
  const c=cards[id];if(!c)return;
  const v=valOf(curDate,id),sv=hasVal(v)?String(v):'';
  if(force&&document.activeElement!==c.inp)c.inp.value=sv;
  c.el.classList.toggle('filled',hasVal(v));
  const p=prevRecord(curDate),pv=p&&p.rec.values?p.rec.values[id]:undefined,d=diffOf(id);
  c.el.querySelector('.sub').innerHTML=(hasVal(pv)?'前次 '+pv+'（'+p.date.slice(5).replace('-','/')+'）':'無前次紀錄')+(d.t?' · <span class="diff '+d.c+'">'+d.t+'</span>':'');
}
function syncFromRemote(){
  S.items.forEach(it=>{
    const c=cards[it.id];if(!c)return;
    const v=valOf(curDate,it.id),sv=hasVal(v)?String(v):'';
    if(document.activeElement!==c.inp&&c.inp.value!==sv){c.inp.value=sv;if(Date.now()-BOOT_AT>4000){c.inp.classList.remove('flash');void c.inp.offsetWidth;c.inp.classList.add('flash')}}
    refreshCard(it.id);
  });
  syncMeta(true);renderChips();updateProg();
}
function syncMeta(flash){
  const r=S.days[curDate]||{};
  [['staff','staff']].forEach(([id,k])=>{
    const el=$(id),v=r[k]||'';
    if(document.activeElement!==el&&el.value!==v){el.value=v;if(flash&&Date.now()-BOOT_AT>4000){el.classList.remove('flash');void el.offsetWidth;el.classList.add('flash')}}
  });
}
function updateProg(){
  const its=S.items.filter(i=>i.name);const n=its.filter(i=>hasVal(valOf(curDate,i.id))).length;
  $('progBar').style.width=(its.length?n/its.length*100:0)+'%';
}
$('staff').addEventListener('input',e=>{dayOf(curDate).staff=e.target.value;writeField(curDate,'m','staff',e.target.value)});
$('staff').addEventListener('change',e=>flashEl(e.target));
$('btnCopyPrev').onclick=()=>{
  const p=prevRecord(curDate);if(!p){toast('沒有更早的紀錄可帶入');return}
  let n=0;const cs=[];S.items.forEach(it=>{const v=p.rec.values&&p.rec.values[it.id];if(hasVal(v)&&!hasVal(valOf(curDate,it.id))){
    const day=dayOf(curDate);day.values=day.values||{};day.values[it.id]=v;writeField(curDate,'v',it.id,v);n++;const c=it.cat||'未分類';if(!cs.includes(c))cs.push(c)}});

let clrArm=0;
$('btnClear').onclick=async()=>{
  const b=$('btnClear');
  if(!clrArm){clrArm=1;b.textContent='再按確認';setTimeout(()=>{clrArm=0;b.textContent='清空'},3000);return}

/* ---------- 匯出 Excel ---------- */
const num=v=>hasVal(v)?v:'';
function buildWorkbook(){
  const its=S.items.filter(i=>i.name),wb=XLSX.utils.book_new();
  const label=i=>i.name+(i.unit?'('+i.unit+')':'');
  const p=prevRecord(curDate),cur=S.days[curDate]||{};const cv=cur.values||{};
  const a1=[['青山巨城店 每日盤點表'],['日期',curDate,'星期','週'+WD[parse(curDate).getDay()]],['盤點人員',cur.staff||''],[],['分類','品項','單位','前次'+(p?'（'+p.date+'）':''),'今日盤點','增減']];
  its.forEach(i=>{const c=cv[i.id],pv=p&&p.rec.values?p.rec.values[i.id]:undefined;
    a1.push([i.cat||'',i.name,i.unit||'',num(pv),num(c),(hasVal(c)&&hasVal(pv))?Math.round((c-pv)*100)/100:''])});
  const ws1=XLSX.utils.aoa_to_sheet(a1);ws1['!cols']=[{wch:8},{wch:20},{wch:8},{wch:18},{wch:12},{wch:10}];
  XLSX.utils.book_append_sheet(wb,ws1,'當日盤點');
  const [y,m]=curDate.split('-').map(Number),days=new Date(y,m,0).getDate();
  const a2=[['日期','星期','盤點人員',...its.map(label)]];
  for(let d=1;d<=days;d++){const ds=y+'-'+pad(m)+'-'+pad(d),r=S.days[ds]||{};
    a2.push([d,'週'+WD[new Date(y,m-1,d).getDay()],r.staff||'',...its.map(i=>num(r.values&&r.values[i.id]))])}
  const ws2=XLSX.utils.aoa_to_sheet(a2);ws2['!cols']=[{wch:6},{wch:6},{wch:10},...its.map(()=>({wch:10}))];
  XLSX.utils.book_append_sheet(wb,ws2,y+'年'+m+'月');
  const a3=[['日期','星期','盤點人員',...its.map(label)]];
  Object.keys(S.days).filter(d=>hasData(S.days[d])).sort().forEach(d=>{const r=S.days[d];a3.push([d,'週'+WD[parse(d).getDay()],r.staff||'',...its.map(i=>num(r.values&&r.values[i.id]))])});
  const ws3=XLSX.utils.aoa_to_sheet(a3);ws3['!cols']=[{wch:12},{wch:6},{wch:10},...its.map(()=>({wch:10}))];
  XLSX.utils.book_append_sheet(wb,ws3,'全部歷史');
  return wb;
}
function download(name,blob){
  const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name;document.body.appendChild(a);a.click();
  setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},1500);toast('已匯出 '+name);
}
$('btnExport').onclick=()=>{
  if(typeof XLSX==='undefined'){toast('Excel 元件載入失敗，請確認網路後重新整理');return}
  try{const buf=XLSX.write(buildWorkbook(),{bookType:'xlsx',type:'array'});
    download('盤點表_'+curDate+'.xlsx',new Blob([buf],{type:'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet'}))}
  catch(e){toast('匯出失敗：'+e.message)}
};
$('btnBackup').onclick=()=>download('盤點備份_'+todayStr+'.json',new Blob([JSON.stringify({items:S.items,nextId:S.nextId,days:S.days},null,1)],{type:'application/json'}));
$('fileRestore').onchange=e=>{

async function boot(){
  tick();updateDateUI();renderChips();renderItems();setStatus();
  const c=getCfg();
  if(c.dbUrl&&c.code){
    try{store=await makeCloudStore(c.dbUrl,c.code)}
    catch(e){store=null;const b=$('banner');b.textContent='無法連上雲端同步（'+e.message+'），已改用本機模式。';b.classList.remove('hidden')}
  }
  if(!store){
    store=makeLocalStore();
    if(!c.dbUrl){const b=$('banner');b.textContent='目前是「本機模式」：資料只存在這支手機。要讓大家即時同步，請到「設定」填入 Firebase 資料庫網址與店家代碼。';b.classList.remove('hidden')}
  }
  store.subscribe(onDays,onItems,e=>{toast('同步錯誤：'+(e&&e.message||'請檢查資料庫規則'));const b=$('banner');b.textContent='雲端讀寫被拒絕，請檢查 Firebase 規則是否已設定（見設定說明）。';b.classList.remove('hidden')});
  setStatus();loadDate(curDate);
}
boot();
/* ---------- 自動檢查更新（加入主畫面也會更新） ---------- */
const APP_VER=document.querySelector('meta[name=app-version]').content;
let updChecking=false;
const hashStr=t=>{let h=5381;for(let i=0;i<t.length;i++)h=((h<<5)+h+t.charCodeAt(i))|0;return t.length+':'+h};
async function checkUpdate(manual){
  if(updChecking)return;updChecking=true;
  try{
    const base=location.href.split('#')[0].split('?')[0];
    // 手機目前使用的（快取）版本 vs 網站上的最新版本，內容只要有任何不同就更新
    const [a,b]=await Promise.all([
      fetch(base,{cache:'force-cache'}).then(r=>r.text()),
      fetch(base+'?_='+Date.now(),{cache:'no-store'}).then(r=>r.text())
    ]);
    if(hashStr(a)!==hashStr(b)){
      const last=+sessionStorage.getItem('updAt')||0;
      if(!manual&&Date.now()-last<30000)return;
      sessionStorage.setItem('updAt',Date.now());
      toast('發現新版本，更新中…');
      try{if(window.caches){const ks=await caches.keys();await Promise.all(ks.map(k=>caches.delete(k)))}}catch(e){}
      try{const rs=navigator.serviceWorker&&await navigator.serviceWorker.getRegistrations();rs&&rs.forEach(r=>r.unregister())}catch(e){}
      await fetch(base,{cache:'reload'}).catch(()=>{});
      setTimeout(()=>location.reload(),500);return;
    }
    if(manual)toast('已是最新版本');
  }catch(e){if(manual)toast('無法檢查更新，請確認網路')}
  finally{updChecking=false}
}
$('btnUpdate').onclick=()=>checkUpdate(true);
document.addEventListener('visibilitychange',()=>{if(!document.hidden)checkUpdate(false)});
window.addEventListener('pageshow',e=>{if(e.persisted)checkUpdate(false)});
setTimeout(()=>checkUpdate(false),1500);
})();
</script>
