<title>青山巨城店 盤點表</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>
:root{
  --bg:#f3ecdc;--card:#fcf9f1;--ink:#22332c;--muted:#75806f;--line:#e1d7bd;
  --accent:#3f6b5a;--accent-ink:#fff;--accent-soft:#dde8df;--sun:#c4581f;--warn:#b4570a;--warn-soft:#f8e6d2;
  --up:#3f6b5a;--down:#c0392b;--input:#f8f3e6;
}
@media (prefers-color-scheme:dark){:root{
  --bg:#141d18;--card:#1c2822;--ink:#ece8da;--muted:#94a394;--line:#2b3a32;
  --accent:#7fb59d;--accent-ink:#0f1c16;--accent-soft:#263b32;--sun:#e58a55;--warn:#f0a35a;--warn-soft:#3a2a17;
  --up:#7fb59d;--down:#ff8a7a;--input:#17211c}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:-apple-system,"PingFang TC","Noto Sans TC","Microsoft JhengHei",system-ui,sans-serif;font-size:16px;line-height:1.45;
  padding-bottom:calc(72px + env(safe-area-inset-bottom,0px))}
button{font:inherit;color:inherit;cursor:pointer}
input,select{font:inherit;font-size:16px;color:var(--ink);background:var(--input);border:1px solid var(--line);border-radius:10px;padding:10px 12px;min-width:0;width:100%}
input:focus{outline:2px solid var(--accent);outline-offset:-1px}
.hidden{display:none!important}
.wrap{max-width:720px;margin:0 auto}

/* 頂部固定區 */
.top{position:sticky;top:0;z-index:10;background:var(--bg);padding:calc(8px + env(safe-area-inset-top,0px)) 12px 8px;border-bottom:1px solid var(--line)}
.bar{display:flex;align-items:center;gap:8px;margin-bottom:8px}
.logo{height:38px;width:auto;flex:none}
.ttl{font-weight:800;font-size:17px;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--accent);line-height:1.15}
.ttl small{display:block;font-size:11px;font-weight:600;color:var(--sun);letter-spacing:.08em}
.top{border-bottom:0}
details.sync summary{font-weight:800;font-size:16px;cursor:pointer;list-style:none;display:flex;justify-content:space-between;align-items:center}
details.sync summary::-webkit-details-marker{display:none}
details.sync summary::after{content:"▾";color:var(--muted)}
details.sync[open] summary::after{content:"▴"}
details.sync .body{margin-top:12px}
.pill{font-size:12px;padding:3px 10px;border-radius:99px;background:var(--accent-soft);color:var(--accent);font-weight:700;white-space:nowrap}
.pill.warn{background:var(--warn-soft);color:var(--warn)}
.datenav{display:flex;align-items:center;gap:6px;margin-bottom:8px}
.nb{width:44px;height:44px;border-radius:12px;border:1px solid var(--line);background:var(--card);font-size:18px;flex:none}
.dwrap{flex:1;position:relative;height:44px;border:1px solid var(--line);border-radius:12px;background:var(--card);display:flex;align-items:center;justify-content:center;font-weight:800;font-size:17px}
.dwrap input{position:absolute;inset:0;opacity:0;width:100%;height:100%;padding:0;border:0}
.todaybtn{height:44px;padding:0 12px;border-radius:12px;border:1px solid var(--accent);background:var(--accent);color:var(--accent-ink);font-weight:700;flex:none}
.toolrow{display:flex;gap:6px;align-items:center;margin-bottom:8px}
.search{position:relative;flex:1;min-width:0;max-width:150px}
.btn.sm{min-height:34px;padding:0 10px;font-size:14px;border-radius:10px;flex:none;white-space:nowrap}
.search input{height:34px;font-size:15px;padding:0 26px 0 30px;border-radius:10px;background:var(--card)}
.search .ic{font-size:13px;position:absolute;left:9px;top:50%;transform:translateY(-50%);color:var(--muted);pointer-events:none}
.search .x{position:absolute;right:4px;top:50%;transform:translateY(-50%);width:28px;height:34px;border:0;background:none;color:var(--muted);font-size:15px}
.chips{display:flex;gap:8px;overflow-x:auto;padding-bottom:2px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;border:1px solid var(--line);background:var(--card);border-radius:99px;padding:8px 14px;font-weight:700;font-size:15px;white-space:nowrap}
.chip small{font-weight:600;color:var(--muted);margin-left:4px}
.chip.on{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.prog i{background:linear-gradient(90deg,var(--accent),var(--sun))!important}
.chip.on small{color:var(--accent-ink);opacity:.85}
.prog{height:4px;background:var(--line);border-radius:4px;margin-top:8px;overflow:hidden}
.prog i{display:block;height:100%;width:0;background:var(--accent);transition:width .3s}

/* 品項卡片 */
.list{padding:10px 12px}
.meta{background:var(--card);border:1px solid var(--line);border-radius:14px;margin-bottom:10px}
.meta summary{padding:12px 14px;font-weight:700;cursor:pointer;list-style:none;display:flex;justify-content:space-between;color:var(--muted)}
.meta summary::-webkit-details-marker{display:none}
.meta .in{padding:0 14px 14px;display:grid;gap:8px}
.metarow{display:flex;align-items:center;gap:10px;padding:8px 10px 8px 14px}
.metarow .mi{font-weight:700;white-space:nowrap;flex:none}
.metarow input{flex:none;width:130px;min-width:0;height:36px;font-size:15px;padding:0 12px;border-radius:10px}
.item{display:flex;align-items:center;gap:10px;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:10px 10px 10px 14px;margin-bottom:8px}
.item{position:relative;overflow:hidden}
.item.filled{border:2px solid var(--flash);padding:9px 9px 9px 13px}
.info{flex:1;min-width:0}
.nm{font-weight:800;font-size:17px;overflow-wrap:anywhere}
.nm .muted{color:#e07b1a;font-weight:700}
.cat{font-size:11px;font-weight:700;color:var(--muted);border:1px solid var(--line);border-radius:6px;padding:0 6px;margin-left:6px;vertical-align:2px}
.sub{font-size:13px;color:var(--muted);margin-top:2px}
.diff{font-weight:800}.diff.up{color:var(--up)}.diff.down{color:var(--down)}
.stp{display:flex;align-items:center;gap:6px;flex:none}
.sb{width:44px;height:48px;border-radius:12px;border:1px solid var(--line);background:var(--input);font-size:22px;font-weight:700;line-height:1}
.sb:active{background:var(--accent-soft)}
.qty{width:74px;height:48px;text-align:center;font-size:22px;font-weight:800;padding:0 4px;border-radius:12px}
@keyframes fl{from{background:var(--flash-soft);box-shadow:0 0 0 3px var(--flash)}to{background:var(--input);box-shadow:none}}
.qty.flash{animation:fl 1.6s ease-out}
.empty{text-align:center;color:var(--muted);padding:30px 10px}

/* 通用卡片 */
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;margin:10px 12px}
.card h2{font-size:16px;margin:0 0 10px}
.muted{color:var(--muted);font-size:13px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.btn{border:1px solid var(--line);background:var(--card);border-radius:12px;padding:11px 14px;font-weight:700;min-height:44px}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.danger{color:var(--down)}
.btn:disabled{opacity:.5}
.field{display:block;margin-bottom:10px}.field span{display:block;font-size:12px;color:var(--muted);margin-bottom:3px}
.scroll{overflow-x:auto;-webkit-overflow-scrolling:touch}
table{border-collapse:collapse;width:100%;font-size:14px}
th,td{padding:7px 8px;border-bottom:1px solid var(--line);text-align:right;white-space:nowrap}
th{color:var(--muted);font-size:12px;position:sticky;top:0;background:var(--card)}
th:nth-child(-n+3),td:nth-child(-n+3){text-align:left}
td.day{font-weight:800;color:#8a5a00;cursor:pointer}
tr.has td{background:#fbeaa0}
tr.cur td{outline:0;box-shadow:inset 0 2px 0 #e0a800,inset 0 -2px 0 #e0a800}
tr.cur td:first-child{box-shadow:inset 0 2px 0 #e0a800,inset 0 -2px 0 #e0a800,inset 2px 0 0 #e0a800}
tr.cur td:last-child{box-shadow:inset 0 2px 0 #e0a800,inset 0 -2px 0 #e0a800,inset -2px 0 0 #e0a800}
.irow{display:grid;grid-template-columns:1fr 70px;gap:6px;margin-bottom:6px}
.irow2{display:flex;align-items:stretch;gap:8px;margin-bottom:10px;padding:8px;background:var(--card);border:1px solid var(--line);border-radius:12px;position:relative}
.irow2 .fields{flex:1;min-width:0;display:grid;gap:6px}
.irow2 .irow{margin-bottom:0}
.irow2 .ib{align-self:center;flex:none}
.grip{flex:none;width:40px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;border-radius:10px;background:var(--input);border:1px solid var(--line);cursor:grab;touch-action:none;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none}
.grip i{display:block;width:18px;height:2.5px;border-radius:2px;background:var(--muted)}
.irow2.dragging{z-index:20;box-shadow:0 8px 22px rgba(0,0,0,.28);border-color:var(--flash);opacity:.97;transition:none;cursor:grabbing}
.irow2.dragging .grip{background:var(--flash-soft);cursor:grabbing}
.dragtip{font-size:12px;color:var(--muted);margin:-4px 0 10px}
.ib{width:42px;height:42px;border-radius:10px;border:1px solid var(--line);background:var(--input)}

/* 底部導覽 */
html,body,button,input,label,summary,.chip,.qty{touch-action:manipulation;-webkit-tap-highlight-color:transparent}
button,.chip,summary{-webkit-user-select:none;user-select:none}
#tab-settings{padding-bottom:72px}
.totop{position:fixed;right:14px;bottom:calc(var(--navh,64px) + env(safe-area-inset-bottom,0px) + 14px);z-index:30;min-width:54px;height:38px;padding:0 12px;border-radius:19px;border:1px solid var(--line);background:var(--card);color:var(--accent);font-weight:800;font-size:14px;box-shadow:0 3px 12px rgba(0,0,0,.22);opacity:0;pointer-events:none;transform:translateY(8px);transition:opacity .2s,transform .2s}
.totop.show{opacity:1;pointer-events:auto;transform:none}
.totop.hot{background:var(--accent);color:#fff;border-color:var(--accent);transform:scale(1.12)}
.addbar{position:fixed;left:0;right:0;bottom:calc(var(--navh,64px) + env(safe-area-inset-bottom,0px));z-index:19;padding:8px 12px;display:flex;justify-content:center;background:linear-gradient(to top,var(--bg,#f3ebdc) 70%,transparent)}
.addbar .btn{width:100%;max-width:696px;min-height:44px;box-shadow:0 2px 8px rgba(0,0,0,.15)}
.nav{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--card);border-top:1px solid var(--line);display:flex;padding-bottom:env(safe-area-inset-bottom,0px)}
.nav button{flex:1;border:0;background:none;padding:9px 0 8px;font-size:12px;font-weight:700;color:var(--muted);display:flex;flex-direction:column;align-items:center;gap:1px}
.nav button b{margin-bottom:2px}
.nav button.on{color:var(--accent)}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(84px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:99px;font-size:14px;z-index:30;opacity:0;pointer-events:none;transition:opacity .2s;max-width:92%;text-align:center}
.toast.show{opacity:1}
.banner{background:var(--warn-soft);color:var(--warn);padding:10px 12px;font-size:14px;margin:10px 12px 0;border-radius:12px}
.nic{width:26px;height:26px;display:block;margin-bottom:2px}
.nav button .nic.a{display:none}.nav button.on .nic.a{display:block}.nav button.on .nic.g{display:none}
.ib.arm{background:var(--down)!important;border-color:var(--down)!important;color:#fff!important;font-size:13px;font-weight:800;white-space:nowrap;padding:0;letter-spacing:0}
tr.has td,tr.has td.day{background:#fbeaa0!important;color:#3d3208}
td.day{text-align:center!important}
#histTable th:nth-child(n+4),#histTable td:nth-child(n+4){text-align:center}
#histTable th:nth-child(-n+3),#histTable td:nth-child(-n+3){text-align:center}
@media (prefers-color-scheme:dark){tr.has td{background:#5a4c12!important;color:#fff3c2;border-bottom-color:#8a7420}td.day{color:#f5d76e}}
.avatar{width:26px;height:26px;border-radius:50%;object-fit:cover;vertical-align:middle;margin-right:8px;border:1px solid var(--line)}
.mi{display:flex;align-items:center;color:var(--ink)}
:root{--flash:#2c8fa0;--flash-soft:#dff0f2}
@media (prefers-color-scheme:dark){:root{--flash:#4db6c6;--flash-soft:#1f3a40}}

/* 月庫存管理表：表頭固定在畫面上方（跟著上下滑），日期欄固定在左邊（跟著左右滑） */
.hhead{position:sticky;top:env(safe-area-inset-top,0px);z-index:8;overflow:hidden;background:var(--card);border:1px solid var(--line);border-bottom:2px solid var(--accent);border-radius:10px 10px 0 0}
.hbody{overflow-x:auto;-webkit-overflow-scrolling:touch;border:1px solid var(--line);border-top:0;border-radius:0 0 10px 10px}
.htab{border-collapse:separate;border-spacing:0;table-layout:fixed}
.htab th,.htab td{padding:6px 3px;border-bottom:1px solid var(--line);border-right:1px solid var(--line);text-align:center;font-size:14px}
.htab th{position:static;top:auto;background:var(--card);color:var(--ink);font-size:12px;font-weight:800;line-height:1.2;vertical-align:bottom;border-bottom:0;white-space:normal;overflow-wrap:anywhere}
.htab td{white-space:nowrap;overflow:hidden}
.htab th:nth-child(1),.htab td:nth-child(1){position:sticky;left:0;z-index:2}
.htab th:nth-child(2),.htab td:nth-child(2){position:sticky;left:38px;z-index:2;border-right:2px solid var(--accent)}
.htab td:nth-child(1),.htab td:nth-child(2){background:var(--card)}
#histTable tr.selr td{box-shadow:inset 0 2px 0 var(--flash),inset 0 -2px 0 var(--flash)}
#histHeadTable th.selc{background:var(--flash);color:#fff}

/* 月表：篩選、單一品項 */
.seg{display:flex;background:var(--line);padding:3px;border-radius:12px;margin-bottom:10px}
.seg button{flex:1;border:0;background:none;padding:9px 6px;border-radius:9px;font-weight:700;font-size:14px;color:var(--muted)}
.seg button.on{background:var(--card);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.15)}
.hsearch{position:relative;margin-bottom:8px}
.hsearch input{padding:0 36px 0 36px;height:42px;border-radius:12px;background:var(--card)}
.hsearch .ic{position:absolute;left:12px;top:50%;transform:translateY(-50%);color:var(--muted);pointer-events:none}
.hsearch .x{position:absolute;right:2px;top:50%;transform:translateY(-50%);width:38px;height:38px;border:0;background:none;color:var(--muted);font-size:16px}
#hChips{margin-bottom:10px}
.pills{display:flex;flex-wrap:wrap;gap:6px;max-height:120px;overflow:auto;margin-bottom:12px}
.pl{border:1px solid var(--line);background:var(--card);border-radius:99px;padding:7px 13px;font-weight:700;font-size:14px}
.pl.on{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-bottom:10px}
.stat{background:var(--input);border:1px solid var(--line);border-radius:10px;padding:6px 4px;text-align:center}
.stat b{display:block;font-size:17px}.stat span{font-size:11px;color:var(--muted)}
.lrow{display:flex;align-items:center;gap:8px;padding:10px 4px;border-bottom:1px solid var(--line);cursor:pointer}
.lrow .d{flex:1;font-weight:700}.lrow .v{font-size:18px;font-weight:800;min-width:44px;text-align:right}
.lrow .df{min-width:48px;text-align:right}
.htab th[data-id]{cursor:pointer}
.htab td.day.tdy{background:var(--sun)!important;color:#fff!important}
.expbar{flex-wrap:nowrap!important;gap:6px!important}
.expbar .btn{flex:1 1 0;min-width:0;min-height:38px;padding:7px 4px;font-size:13px;white-space:nowrap;display:flex;align-items:center;justify-content:center;border-radius:10px;text-align:center}

.syncbox{display:flex;align-items:center;gap:6px;flex:none;cursor:pointer;opacity:.85}
.syncbox .dot{width:8px;height:8px;border-radius:50%;background:#2fa36b;flex:none;transition:background .2s}
.syncbox .dot.busy{background:#e0a030}
.syncbox .dot.off{background:#d6453d}
.syncbox .le{line-height:1.15;text-align:right}
.syncbox small{display:block;font-size:10px;color:var(--muted)}
.syncbox b{display:block;font-size:11px;font-weight:600;color:var(--muted);white-space:nowrap}

@keyframes loc{0%,100%{box-shadow:0 0 0 0 rgba(44,143,160,0);background:var(--card)}50%{box-shadow:0 0 0 6px var(--flash);background:var(--flash-soft)}}
.item.locate{animation:loc .9s ease-in-out 3;border-color:var(--flash)}
.htab tbody td:not(.day){cursor:pointer}

/* 進度條：深綠底＋橘色填充，字樣 PEAK TEA（Futura 字型、白字、寬字距） */
:root{--prog:#c1531b;--sun:#c1531b;--progTrack:#41695b}
@media (prefers-color-scheme:dark){:root{--prog:#d9743a;--sun:#e58a55;--progTrack:#2a443b}}
.prog{position:relative;height:18px;border:1.5px solid var(--progTrack);border-radius:99px;background:var(--progTrack);overflow:hidden;margin-top:8px;box-shadow:0 1.5px 0 var(--line)}
.prog .pf{position:absolute;left:0;top:0;bottom:0;width:0;overflow:hidden;border-radius:99px;background:var(--prog)}
.prog .pf::before{content:"";position:absolute;left:0;right:0;top:0;height:50%;background:rgba(255,255,255,.14)}
.prog .pf::after{content:"";position:absolute;left:8px;right:8px;top:2px;height:1.5px;border-radius:2px;background:rgba(255,255,255,.55)}
.prog .pt{position:absolute;inset:0;z-index:2;display:flex;align-items:center;justify-content:center;font-family:"Futura","Futura-Medium","Jost","Century Gothic","Avenir Next","Trebuchet MS",system-ui,sans-serif;font-size:10px;font-weight:500;letter-spacing:.5em;padding-left:.5em;color:#fff;text-transform:uppercase;line-height:1;user-select:none;-webkit-user-select:none;pointer-events:none}

/* 分類按鈕：青藍色 */
:root{--teal:#2c8fa0;--teal-soft:#dff0f2;--teal-line:#b4dae0;--teal-ink:#fff}
@media (prefers-color-scheme:dark){:root{--teal:#4db6c6;--teal-soft:#1f3a40;--teal-line:#2f5963;--teal-ink:#0b2227}}
.chip{background:var(--teal-soft);border-color:var(--teal-line);color:var(--ink)}
.chip small{color:var(--muted)}
.chip.on{background:var(--teal);border-color:var(--teal);color:var(--teal-ink)}
.chip.on small{color:var(--teal-ink);opacity:.85}

/* v46：低庫存、搜尋、鎖定畫面 */
.item.low{border:2px solid var(--down);background:rgba(192,57,43,.08);padding:9px 9px 9px 13px}
.item.filled.low{border-color:var(--down)}
.lowtag{color:var(--down);font-weight:800}
.chip.alert{border-color:var(--down);color:var(--down);background:rgba(192,57,43,.1)}
.chip.alert small{color:inherit}
.chip.alert.on{background:var(--down);border-color:var(--down);color:#fff}
.chip.alert.on small{color:#fff}
.chips.searching .chip.on{background:var(--teal-soft);border-color:var(--teal-line);color:var(--ink)}
.chips.searching .chip.on small{color:var(--muted)}
.chips.searching .chip.alert.on{background:rgba(192,57,43,.1);color:var(--down);border-color:var(--down)}
.htab td.lowc{color:var(--down);font-weight:800}
.irow.r2{grid-template-columns:1fr 92px}

/* v48：數字異常提醒（黃色） */
:root{--yel:#d9a400;--yel-soft:#fff5cf;--yel-ink:#6b5200}
@media (prefers-color-scheme:dark){:root{--yel:#f0c64a;--yel-soft:#3a3218;--yel-ink:#f6dc8a}}
.item.warn:not(.low){border:2px solid var(--yel);background:var(--yel-soft);padding:9px 9px 9px 13px}
.item.warn .qty{background:var(--yel-soft);border-color:var(--yel)}
.warnline{margin-top:4px;font-size:13px;font-weight:700;color:var(--yel-ink);display:flex;flex-wrap:wrap;align-items:center;gap:6px}
.okbtn{border:1px solid var(--yel);background:var(--card);color:var(--ink);border-radius:8px;padding:3px 10px;font-weight:800;font-size:13px}
.chip.warnchip{border-color:var(--yel);background:var(--yel-soft);color:var(--yel-ink)}
.chip.warnchip small{color:inherit}
.chip.warnchip.on{background:var(--yel);border-color:var(--yel);color:#2b2100}
.chip.warnchip.on small{color:#2b2100}
.chips.searching .chip.warnchip.on{background:var(--yel-soft);border-color:var(--yel);color:var(--yel-ink)}

/* v51：設定開關 */
.swrow{display:flex;align-items:center;justify-content:space-between;gap:12px;font-weight:700}
.swrow small{display:block;font-weight:500;font-size:12px;color:var(--muted);margin-top:2px}
input.sw{appearance:none;-webkit-appearance:none;flex:none;width:52px;height:30px;border-radius:99px;background:var(--line);border:0;padding:0;position:relative;cursor:pointer;transition:background .2s}
input.sw::after{content:"";position:absolute;top:3px;left:3px;width:24px;height:24px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.3);transition:transform .2s}
input.sw:checked{background:var(--accent)}
input.sw:checked::after{transform:translateX(22px)}
input.sw:focus{outline:none}

/* v57：停用品項 */
.acts{display:flex;flex-direction:column;gap:6px;align-self:center;flex:none}
.ib.offb{font-size:12px;font-weight:700;color:var(--muted)}
details.offbox{margin-top:14px;padding-top:10px;border-top:1px dashed var(--line)}
details.offbox summary{font-weight:800;cursor:pointer;color:var(--muted)}
.offrow{display:flex;align-items:center;gap:8px;padding:8px 10px;margin-bottom:8px;background:var(--input);border:1px solid var(--line);border-radius:12px;opacity:.9}
.offname{flex:1;min-width:0}.offname b{display:block;overflow-wrap:anywhere}.offname small{color:var(--muted)}
.offrow .onb{min-height:40px;padding:6px 14px}
.offtag{font-size:10px;font-weight:700;color:var(--muted)}

/* v57：字體大小、分組、下一個未填、復原、品項備註 */
.item .nm{font-size:calc(17px*var(--k,1))}
.item .sub,.item .warnline,.item .itext{font-size:calc(13px*var(--k,1))}
.item .cat{font-size:calc(11px*var(--k,1))}
.item .qty{width:calc(74px*var(--k,1));height:calc(48px*var(--k,1));font-size:calc(22px*var(--k,1))}
.item .sb{width:calc(44px*var(--k,1));height:calc(48px*var(--k,1));font-size:calc(22px*var(--k,1))}
.chips .chip{font-size:calc(15px*var(--k,1))}
.grp{margin-bottom:6px}
.gh{width:100%;display:flex;align-items:center;gap:8px;background:var(--teal-soft);border:1px solid var(--teal-line);border-radius:12px;padding:10px 14px;margin:4px 0 8px;font-weight:800;font-size:calc(16px*var(--k,1));color:var(--ink);text-align:left}
.gh .gc{margin-left:auto;color:var(--muted);font-weight:700;font-size:calc(14px*var(--k,1))}
.gh .gcar{color:var(--muted);transition:transform .15s}
.grp.closed .gcar{transform:rotate(-90deg)}
.grp.closed .gb{display:none}
.grp.done .gh{border-color:var(--flash)}
.grp.done .gc{color:var(--flash)}
.nbtn{border:0;background:none;font-size:14px;padding:0 4px;opacity:.35;vertical-align:1px}
.nbtn.has{opacity:1}
.itext{margin-top:3px;font-weight:700;color:var(--ink);overflow-wrap:anywhere}
.ninp{height:36px;font-size:15px;margin-top:6px;border-radius:10px}
.lnote{display:block;font-weight:500;font-size:12px;color:var(--muted)}
.htab td.hasn{position:relative}
.htab td.hasn::after{content:"";position:absolute;top:2px;right:2px;width:6px;height:6px;border-radius:50%;background:var(--sun)}
.swrow2{display:flex;align-items:center;justify-content:space-between;gap:12px;font-weight:700;margin-bottom:12px}
.swrow2 .seg{margin:0;min-width:190px}

/* v59：人員姓名顏色 */
:root{--pc-g:#3f6b5a;--pc-o:#c1531b;--pc-t:#2c8fa0;--pc-p:#7a5ab8;--pc-r:#c2456b;--pc-y:#a87800;--pc-b:#2f6fd6;--pc-k:#444}
@media (prefers-color-scheme:dark){:root{--pc-g:#7fb59d;--pc-o:#e58a55;--pc-t:#4db6c6;--pc-p:#b69cf0;--pc-r:#f08aa8;--pc-y:#e6c04a;--pc-b:#7ab0ff;--pc-k:#cfd6d0}}
.pc-g{color:var(--pc-g)!important}.pc-o{color:var(--pc-o)!important}.pc-t{color:var(--pc-t)!important}.pc-p{color:var(--pc-p)!important}
.pc-r{color:var(--pc-r)!important}.pc-y{color:var(--pc-y)!important}.pc-b{color:var(--pc-b)!important}.pc-k{color:var(--pc-k)!important}
.metarow{position:relative}
.palbtn{flex:none;width:36px;height:36px;border-radius:10px;border:2px solid var(--line);background:var(--card);font-size:17px;padding:0;line-height:1}
.pal{position:absolute;left:14px;top:calc(100% + 6px);z-index:40;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:10px;box-shadow:0 8px 24px rgba(0,0,0,.2);display:flex;flex-wrap:wrap;gap:8px;max-width:268px}
.pal .dot8{width:34px;height:34px;border-radius:50%;border:2px solid transparent;padding:0}

.nrow .nx{flex:none;border:0;background:none;color:var(--muted);font-size:14px;padding:4px 6px}

<script>
/* ============================================================
   ★ 同步設定：把 Firebase Realtime Database 網址與店家代碼填在這裡，
     所有人打開網頁就會自動連線（不用各自設定）。
     不填也可以，之後到網頁「設定」頁輸入。
   ============================================================ */
const CONFIG = {
  dbUrl: "https://peaktea-bigcity-default-rtdb.asia-southeast1.firebasedatabase.app",   // 例："https://peaktea-xxxx-default-rtdb.asia-southeast1.firebasedatabase.app"
  code:  "peaktea-bigcity-2025"    // 例："peaktea-bigcity-2026"
};

(function(){
const WD=['日','一','二','三','四','五','六'];
const DEFAULT_CATS=['粉','配料','原料','包裝','發票','其他'];
const RAW=[
 ['熟飲杯蓋','包裝'],['冷飲杯蓋','包裝'],['熟飲杯套','包裝'],['號印珍珠','配料'],['養樂珍珠','配料'],
 ['奶精粉','粉'],['粉粿粉','粉'],['豆黃粉','粉'],['果凍粉','粉'],['杏仁凍粉','粉'],['仙草粉','粉'],
 ['冬瓜醬罐','原料'],['蔗茶','原料'],['荔枝原汁','原料'],['發票紙捲','發票'],['品項貼','發票'],
 ['餐巾紙','包裝'],['餅乾','其他'],['自訂欄1','其他'],['自訂欄2','其他'],['自訂欄3','其他'],['New 大杯 / New 中杯','包裝']];
const DEFAULT_ITEMS=RAW.map((r,i)=>({id:'i'+(i+1),name:r[0],unit:'',cat:r[1]}));
const pad=n=>String(n).padStart(2,'0');
const ymd=d=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
const parse=s=>{const [y,m,d]=s.split('-').map(Number);return new Date(y,m-1,d)};
const $=id=>document.getElementById(id);
const clone=o=>JSON.parse(JSON.stringify(o));
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function toast(m){const t=$('toast');t.textContent=m;t.classList.add('show');clearTimeout(toast.h);toast.h=setTimeout(()=>t.classList.remove('show'),2400)}
const hasVal=v=>(typeof v==='number'&&isFinite(v))||(typeof v==='string'&&v.trim()!==''&&isFinite(Number(v)));
const BOOT_AT=Date.now();

/* ---------- 狀態 ---------- */
let S={items:clone(DEFAULT_ITEMS),nextId:100,days:{}};
let todayStr=ymd(new Date()),curDate=todayStr,histMonth=todayStr.slice(0,7);
let hCat='全部',hQ='',hMode='table',hItem=null;
let catSel='全部',query='';
let store=null,online=true,connected=false;
const pendVals={};      // key -> 尚未被雲端確認的值
let busy=0;

/* ---------- 設定 ---------- */
function getCfg(){
  let sv={};try{sv=JSON.parse(localStorage.getItem('pt_cfg')||'{}')}catch(e){}
  return {dbUrl:(CONFIG.dbUrl||sv.dbUrl||'').trim(),code:(CONFIG.code||sv.code||'').trim()};
}
const cleanCode=c=>c.replace(/[.$#\[\]\/\s]/g,'_');

/* ---------- 儲存層 ---------- */
function makeLocalStore(){
  const K='pt_local_v1';let st;try{st=JSON.parse(localStorage.getItem(K))}catch(e){}
  st=st&&st.days?st:{days:{},itemsJson:null};
  let cbD,cbI,cbN;const save=()=>{try{localStorage.setItem(K,JSON.stringify(st))}catch(e){}};
  const fire=()=>{cbD&&cbD(clone(st.days));cbI&&cbI(st.itemsJson)};
  const fireN=()=>{cbN&&cbN(st.namesHide===undefined?null:st.namesHide)};
  return {kind:'local',
    subscribe(d,i,err,n){cbD=d;cbI=i;cbN=n;fire();fireN()},
    async setNames(json){st.namesHide=json;save();fireN()},
    async setField(date,path,v){
      const day=st.days[date]||(st.days[date]={});
      const parts=path.split('/');let o=day;
      for(let i=0;i<parts.length-1;i++)o=o[parts[i]]||(o[parts[i]]={});
      const k=parts[parts.length-1];if(v===null||v===undefined||v==='')delete o[k];else o[k]=v;
      day.updatedAt=Date.now();save();fire()},
    async setDay(date,obj){if(obj)st.days[date]=obj;else delete st.days[date];save();fire()},
    async setItems(json){st.itemsJson=json;save();fire()}};
}
function loadScript(src){return new Promise((res,rej)=>{const s=document.createElement('script');s.src=src;s.onload=res;s.onerror=()=>rej(new Error('載入失敗'));document.head.appendChild(s)})}
async function makeCloudStore(url,code){
  const V='10.12.2';
  await loadScript('https://www.gstatic.com/firebasejs/'+V+'/firebase-app-compat.js');
  await loadScript('https://www.gstatic.com/firebasejs/'+V+'/firebase-database-compat.js');
  const app=firebase.initializeApp({databaseURL:url});
  const db=firebase.database(app);
  const base=db.ref('stores/'+cleanCode(code));
  db.ref('.info/connected').on('value',s=>{connected=!!s.val();setStatus()});
  return {kind:'cloud',
    subscribe(d,i,err,n){
      base.child('days').on('value',s=>d(s.val()||{}),err);
      base.child('itemsJson').on('value',s=>i(s.val()),err);
      if(n)base.child('namesHide').on('value',s=>n(s.val()),()=>{});
    },
    setNames(json){return base.child('namesHide').set(json)},
    setField(date,path,v){
      const u={};u['days/'+date+'/'+path]=(v===''||v===undefined)?null:v;u['days/'+date+'/updatedAt']=firebase.database.ServerValue.TIMESTAMP;
      return base.update(u)},
    setDay(date,obj){return base.child('days/'+date).set(obj||null)},
    setItems(json){return base.child('itemsJson').set(json)}};
}

/* ---------- 資料存取 ---------- */
function dayOf(d){return S.days[d]||(S.days[d]={})}
function valOf(d,id){const x=S.days[d];return x&&x.values?x.values[id]:undefined}
function hasData(r){return r&&r.values&&Object.values(r.values).some(hasVal)}
function prevRecord(date){
  const ds=Object.keys(S.days).filter(d=>d<date&&hasData(S.days[d])).sort();
  return ds.length?{date:ds[ds.length-1],rec:S.days[ds[ds.length-1]]}:null;
}
function applyPending(){
  for(const k in pendVals){
    const [d,p]=k.split('|');const day=dayOf(d);
    const v=pendVals[k];
    if(p.startsWith('v:')){const id=p.slice(2);day.values=day.values||{};if(hasVal(v))day.values[id]=v;else delete day.values[id]}
    else if(p.startsWith('o:')){const id=p.slice(2);day.ok=day.ok||{};if(v)day.ok[id]=true;else delete day.ok[id]}
    else if(p.startsWith('n:')){const id=p.slice(2);day.inotes=day.inotes||{};if(v)day.inotes[id]=v;else delete day.inotes[id]}
    else{day[p]=v}
  }
}

/* ---------- 自動儲存（每個欄位 0.4 秒合併一次） ---------- */
const timers={};
function persistPend(){try{localStorage.setItem('pt_pend_v1',JSON.stringify(pendVals))}catch(e){}}
let cacheT=null;
function saveCache(){clearTimeout(cacheT);cacheT=setTimeout(()=>{try{
  if(!store||store.kind!=='cloud')return;
  const ds=Object.keys(S.days).sort().slice(-400),days={};ds.forEach(d=>days[d]=S.days[d]);
  localStorage.setItem('pt_cache_v1',JSON.stringify({code:getCfg().code,days,items:S.items,nextId:S.nextId}))}catch(e){}},1500)}
function loadCache(){try{const c=JSON.parse(localStorage.getItem('pt_cache_v1'));
  if(c&&c.code===getCfg().code){S.days=c.days||{};if(Array.isArray(c.items)&&c.items.length){S.items=c.items;S.nextId=c.nextId||S.nextId}return true}}catch(e){}return false}
function writeField(date,kind,id,v){ // kind: 'v' 數量 / 'm' staff,note
  const path=kind==='v'?'values/'+id:kind==='o'?'ok/'+id:kind==='n'?'inotes/'+id:id;
  const key=date+'|'+(kind==='v'?'v:'+id:kind==='o'?'o:'+id:kind==='n'?'n:'+id:id);
  pendVals[key]=v;persistPend();localEditTs=Date.now();
  clearTimeout(timers[key]);setStatus();
  timers[key]=setTimeout(async()=>{
    const sent=pendVals[key];busy++;setStatus();
    try{
      await store.setField(date,path,sent);
      if(pendVals[key]===sent){delete pendVals[key];persistPend()}
    }catch(e){toast('儲存失敗，稍後自動重試');timers[key]=setTimeout(()=>writeField(date,kind,id,pendVals[key]),3000)}
    finally{busy--;setStatus()}
  },400);
}
let localEditTs=0;
function lastEditTs(){
  let t=localEditTs;
  for(const d in S.days){const u=S.days[d]&&S.days[d].updatedAt;if(typeof u==='number'&&u>t)t=u}
  return t;
}
function fmtEdit(t){
  if(!t)return '—';
  const d=new Date(t),n=new Date(),hm=pad(d.getHours())+':'+pad(d.getMinutes());
  return ymd(d)===ymd(n)?'今天 '+hm:(d.getMonth()+1)+'/'+d.getDate()+' '+hm;
}
let statusText='';
function setStatus(){
  const dot=$('syncDot'),le=$('lastEdit');
  const pending=busy>0||Object.keys(pendVals).length>0;
  let cls='',txt='';
  if(!store){cls='busy';txt='連線中…'}
  else if(store.kind==='local'){cls='busy';txt='本機模式（資料只存在這支手機）'}
  else if(!connected){cls='off';txt='離線（恢復後自動同步）'}
  else if(pending){cls='busy';txt='儲存中…'}
  else{cls='';txt='已同步'}
  dot.className='dot'+(cls?' '+cls:'');
  statusText=txt;
  if(le)le.textContent=fmtEdit(lastEditTs());
}

/* ---------- 復原（只存在這次開啟的網頁，每支手機各自） ---------- */
const undoStack=[];
const updateUndoBtn=()=>$('btnUndo').classList.toggle('hidden',!undoStack.length);
function pushUndo(date,ops,label){
  const top=undoStack[undoStack.length-1],now=Date.now();
  if(top&&ops.length===1&&top.ops.length===1&&top.date===date&&top.ops[0].id===ops[0].id&&now-top.t<2500){top.ops[0].next=ops[0].next;top.t=now}   // 連續輸入合併成一筆
  else{undoStack.push({date,ops,label,t:now});if(undoStack.length>40)undoStack.shift()}
  updateUndoBtn();
}
function doUndo(){
  const e=undoStack.pop();updateUndoBtn();if(!e)return;
  if(e.date!==curDate)loadDate(e.date);
  const day=dayOf(e.date);day.values=day.values||{};
  e.ops.forEach(o=>{const v=hasVal(o.prev)?o.prev:'';if(hasVal(v))day.values[o.id]=v;else delete day.values[o.id];writeField(e.date,'v',o.id,v)});
  renderItems();renderChips();updateProg();
  const it=e.ops.length===1?S.items.find(x=>x.id===e.ops[0].id):null;
  toast('已復原：'+(it?it.name:e.label));
}
function cats(){
  const set=[...DEFAULT_CATS];
  S.items.forEach(i=>{if(i.cat&&!set.includes(i.cat))set.push(i.cat)});
  return set.filter(c=>S.items.some(i=>i.name&&!i.off&&i.cat===c));
}
function renderChips(){

function visible(it){
  if(query)return it.name.toLowerCase().includes(query)||(it.cat||'').toLowerCase().includes(query);   // 搜尋時一律搜全部分類
  if(catSel==='未填'){if(hasVal(valOf(curDate,it.id)))return false}
  else if(catSel==='需叫貨'){if(!isLow(it))return false}
  else if(catSel!=='全部'&&(it.cat||'')!==catSel)return false;
  return true;
}

/* ---------- 低庫存判斷 ---------- */
const hasMin=it=>it&&it.min!==undefined&&it.min!==null&&it.min!==''&&!isNaN(Number(it.min));
const lowVal=(it,v)=>hasMin(it)&&hasVal(v)&&Number(v)<Number(it.min);
const isLow=it=>lowVal(it,valOf(curDate,it.id));
/* ---------- 數字異常判斷（和前次比差太多就提醒再確認） ---------- */
function anomaly(it,date){
  const v=valOf(date,it.id);if(!hasVal(v))return null;
  const p=prevRecord(date);const pv=p&&p.rec.values?p.rec.values[it.id]:undefined;
  if(!p||!hasVal(pv))return null;
  if((parse(date)-parse(p.date))/86400000>10)return null;      // 隔太久不比較
  const c=Number(v),b=Number(pv);if(isNaN(c)||isNaN(b)||b<=0)return null;
  // 只抓「差一個位數」這種明顯可能打錯的情況，正常用完、進貨不提醒
  if(c>=b*5&&c-b>=20)return '前次 '+b+'，今天 '+c+'（增加很多）';
  if(c<=b*0.2&&b-c>=10)return '前次 '+b+'，今天 '+c+'（減少很多）';
  return null;
}
/* 只提醒一次：數字輸入完（離開欄位或按 ＋／－ 停頓後）若差很多，所有人的畫面都會同步跳出黃色提醒，8 秒後自動消失 */
const alerted={},warnTimers={},seenAlert={};let alertsInit=false;
function showWarn(id,text){
  const c=cards[id];if(!c)return false;
  const wl=c.el.querySelector('.warnline');
  const off=()=>{c.el.classList.remove('warn');wl.classList.add('hidden')};
  c.el.classList.add('warn');wl.classList.remove('hidden');wl.textContent='⚠ 請再確認：'+text;wl.onclick=off;
  clearTimeout(warnTimers[id]);warnTimers[id]=setTimeout(off,8000);
  return true;
}
function checkAnomaly(it){
  const key=curDate+'|'+it.id,v=valOf(curDate,it.id);
  if(alerted[key]===v)return;            // 同一個數字不重複提醒
  alerted[key]=v;
  const t=anomaly(it,curDate);if(!t)return;
  showWarn(it.id,t);
  const ts=Date.now();seenAlert[key]=ts;   // 同步給其他人（自己不會再重複跳）
  try{Promise.resolve(store.setField(curDate,'alert/'+it.id,{t:ts,x:t})).catch(()=>{})}catch(e){}
}
function detectAlerts(){
  const first=!alertsInit;alertsInit=true;
  for(const date in S.days){
    const al=S.days[date]&&S.days[date].alert;if(!al)continue;
    for(const id in al){
      const a=al[id];if(!a||typeof a.t!=='number')continue;
      const key=date+'|'+id;
      if(seenAlert[key]===a.t)continue;seenAlert[key]=a.t;
      if(first||date!==curDate||Date.now()-a.t>300000)continue;   // 剛連上時的舊提醒、其他日期、太久以前的都不跳
      const it=S.items.find(x=>x.id===id);if(!it)continue;
      showWarn(id,a.x);
      toast('⚠ '+it.name+'：'+a.x);
    }
  }
}

/* ---------- 品項卡片 ---------- */
function flashEl(el){el.classList.remove('flash');void el.offsetWidth;el.classList.add('flash')}
let cards={};
function diffOf(id){
  const p=prevRecord(curDate),c=valOf(curDate,id),pv=p?p.rec.values&&p.rec.values[id]:undefined;
  if(!hasVal(c)||!hasVal(pv))return{t:'',c:''};
  const d=Math.round((Number(c)-Number(pv))*100)/100;
  return{t:(d>0?'+':'')+d,c:d>0?'up':d<0?'down':''};
}
function renderItems(){
  updateProg();
  const box=$('items');box.innerHTML='';cards={};
  const list=dayItems(curDate).filter(visible);
  if(!list.length){box.innerHTML='<div class="empty">'+(S.items.length?'沒有符合的品項':'尚無品項，請到「設定」新增')+'</div>';return}
  const buildCard=(it,parent)=>{
    const el=document.createElement('div');el.className='item';
    el.innerHTML='<div class="info"><div class="nm"></div><div class="sub"></div><div class="itext hidden"></div><div class="warnline hidden"></div><div class="noteedit hidden"><input class="ninp" maxlength="60" placeholder="備註"></div></div><div class="stp"><button class="sb" aria-label="減一">−</button><input class="qty" type="number" inputmode="decimal" step="any" min="0" placeholder="—"><button class="sb" aria-label="加一">＋</button></div>';
    const nm=el.querySelector('.nm');
    nm.innerHTML=(it.off?'<span class="cat" style="margin:0 6px 0 0">已停用</span>':'')+esc(it.name)+(it.unit?' <span class="muted">('+esc(it.unit)+')</span>':'')+(it.cat?'<span class="cat">'+esc(it.cat)+'</span>':'');
    const nb=document.createElement('button');nb.type='button';nb.className='nbtn';nb.setAttribute('aria-label','備註');nb.textContent='📝';nm.appendChild(nb);
    const inp=el.querySelector('input.qty'),[m,p]=el.querySelectorAll('.sb');
    const ne=el.querySelector('.noteedit'),ni=el.querySelector('.ninp');
    const commit=raw=>{
      const v=raw===''?'':Number(raw);if(v!==''&&isNaN(v))return;
      const prev=valOf(curDate,it.id);
      if((hasVal(prev)?Number(prev):'')===v)return;           // 沒有改變
      const day=dayOf(curDate);day.values=day.values||{};if(hasVal(v))day.values[it.id]=v;else delete day.values[it.id];
      writeField(curDate,'v',it.id,v);flashEl(inp);
      pushUndo(curDate,[{id:it.id,prev:hasVal(prev)?prev:'',next:v}]);
      refreshCard(it.id);renderChips();updateProg();
    };
    inp.addEventListener('input',()=>commit(inp.value));
    inp.addEventListener('focus',()=>inp.select());
    inp.addEventListener('keydown',e=>{if(e.key==='Enter'){e.preventDefault();const all=[...box.querySelectorAll('input.qty')].filter(i=>!i.closest('.grp.closed'));const nx=all[all.indexOf(inp)+1];if(nx)nx.focus();else inp.blur()}});
    const bump=d=>{
      if(d<0&&(inp.value===''||Number(inp.value)<=0)){inp.value='';commit('');return}
      const cur=inp.value===''?0:Number(inp.value);const n=Math.max(0,Math.round((cur+d)*100)/100);inp.value=n;commit(String(n))};
    let bt=null;
    m.onclick=()=>{bump(-1);clearTimeout(bt);bt=setTimeout(()=>checkAnomaly(it),1000)};p.onclick=()=>{bump(1);clearTimeout(bt);bt=setTimeout(()=>checkAnomaly(it),1000)};
    inp.addEventListener('blur',()=>{clearTimeout(bt);refreshCard(it.id);renderChips();checkAnomaly(it)});
    // 品項備註
    nb.addEventListener('mousedown',e=>e.preventDefault());
    nb.onclick=()=>{const open=ne.classList.contains('hidden');ne.classList.toggle('hidden',!open);if(open){ni.value=noteOf(curDate,it.id);ni.focus()}refreshCard(it.id)};
    ni.addEventListener('input',()=>{
      const t=ni.value.trim(),day=dayOf(curDate);day.inotes=day.inotes||{};
      if(t)day.inotes[it.id]=t;else delete day.inotes[it.id];
      writeField(curDate,'n',it.id,t?t:null);refreshCard(it.id);
    });
    ni.addEventListener('keydown',e=>{if(e.key==='Enter'){e.preventDefault();ni.blur()}});
    ni.addEventListener('blur',()=>{ne.classList.add('hidden');refreshCard(it.id)});
    parent.appendChild(el);cards[it.id]={el,inp};refreshCard(it.id,true);
  };
  const grouped=groupOn&&!query&&catSel==='全部';
  if(grouped){
    const keys=[...cats()];list.forEach(it=>{const c=it.cat||'未分類';if(!keys.includes(c))keys.push(c)});
    keys.forEach(c=>{
      const g=list.filter(it=>(it.cat||'未分類')===c);if(!g.length)return;
      const wrap=document.createElement('section');wrap.className='grp'+(collapsed[c]?' closed':'');wrap.dataset.cat=c;
      const head=document.createElement('button');head.type='button';head.className='gh';
      head.innerHTML='<span class="gt"></span><span class="gc"></span><span class="gcar">▾</span>';
      const body=document.createElement('div');body.className='gb';
      head.onclick=()=>{collapsed[c]=!collapsed[c];wrap.classList.toggle('closed',!!collapsed[c]);saveCollapsed()};
      wrap.appendChild(head);wrap.appendChild(body);box.appendChild(wrap);
      g.forEach(it=>buildCard(it,body));
    });
  }else list.forEach(it=>buildCard(it,box));
  updateGroupHeads();
}
function updateGroupHeads(){
  document.querySelectorAll('#items .grp').forEach(g=>{
    const cs=[...g.querySelectorAll('.item')],n=cs.filter(x=>x.classList.contains('filled')).length;
    g.querySelector('.gt').textContent=g.dataset.cat;g.querySelector('.gc').textContent=n+'/'+cs.length;
    g.classList.toggle('done',cs.length>0&&n===cs.length);
  });
}
function refreshCard(id,force){
  const c=cards[id];if(!c)return;
  const v=valOf(curDate,id),sv=hasVal(v)?String(v):'';
  if(force&&document.activeElement!==c.inp)c.inp.value=sv;
  c.el.classList.toggle('filled',hasVal(v));
  const itm=S.items.find(x=>x.id===id);const low=lowVal(itm,v);c.el.classList.toggle('low',low);
  const p=prevRecord(curDate),pv=p&&p.rec.values?p.rec.values[id]:undefined,d=diffOf(id);
  c.el.querySelector('.sub').innerHTML=(hasVal(pv)?'前次 '+pv+'（'+p.date.slice(5).replace('-','/')+'）':'無前次紀錄')+(d.t?' · <span class="diff '+d.c+'">'+d.t+'</span>':'')+(hasMin(itm)?' · 最低 '+itm.min:'')+(low?' · <span class="lowtag">⚠ 低於最低量</span>':'');
  const nt=noteOf(curDate,id),ne=c.el.querySelector('.noteedit'),ni=ne.querySelector('input'),tx=c.el.querySelector('.itext');
  const editing=!ne.classList.contains('hidden');
  tx.textContent=nt?'📝 '+nt:'';tx.classList.toggle('hidden',!nt||editing);
  c.el.querySelector('.nbtn').classList.toggle('has',!!nt);
  if(editing&&document.activeElement!==ni&&ni.value!==nt)ni.value=nt;
}
function syncFromRemote(){
  S.items.forEach(it=>{
    const c=cards[it.id];if(!c)return;
    const v=valOf(curDate,it.id),sv=hasVal(v)?String(v):'';
    if(document.activeElement!==c.inp&&c.inp.value!==sv){c.inp.value=sv;if(Date.now()-BOOT_AT>4000){c.inp.classList.remove('flash');void c.inp.offsetWidth;c.inp.classList.add('flash')}}
    refreshCard(it.id);
  });
  syncMeta(true);renderChips();updateProg();

function staffColorOf(date){

function onNames(json){   // 雲端「名字簿／不再顯示的名字」有變動 → 所有手機同步
  if(json===null||json===undefined){if(hiddenNames.length||nameBook.length)saveNames();return}   // 雲端還沒有資料：把這支手機原有的上傳
  try{
    const o=JSON.parse(json);let push=false;
    if(Array.isArray(o)){hiddenNames=o}                                 // 舊格式（只有隱藏名單）
    else if(o&&typeof o==='object'){
      hiddenNames=Array.isArray(o.hide)?o.hide:[];

      nameBook=rb.map(x=>({n:x.n,c:x.c||'',t:x.t||0}));
      // 這支手機有、雲端還沒有的名字，補上去
      try{JSON.parse(localStorage.getItem('pt_namebook')||'[]').forEach(x=>{if(x&&x.n&&!nameBook.some(y=>y.n===x.n)&&!hiddenNames.includes(x.n)){nameBook.push(x);push=true}})}catch(_){}
    }
    try{localStorage.setItem('pt_namehide',JSON.stringify(hiddenNames));localStorage.setItem('pt_namebook',JSON.stringify(nameBook))}catch(_){}

    if(document.activeElement===$('staff'))showNameList();
  }catch(e){}

function knownNames(){
  const map=new Map();
  Object.keys(S.days).sort().forEach(d=>{
    if(d===curDate)return;                                   // 今天正在輸入的不算
    const x=S.days[d],n=x&&x.staff?String(x.staff).trim():'';if(!n)return;
    const c=x.scolor==='x'?'':(PCOLORS.includes(x.scolor)?x.scolor:null);
    const prev=map.get(n);
    map.set(n,{last:d,color:c===null?(prev?prev.color:''):c});   // 以最近一次選的顏色為準
  });
  const hid=getHiddenNames();
  const out=new Map();
  map.forEach((v,n)=>out.set(n,{color:v.color,ts:Date.parse(v.last)||0}));
  nameBook.forEach(x=>{const o=out.get(x.n);out.set(x.n,{color:x.c||'',ts:Math.max(x.t||0,o?o.ts:0)})});   // 名字簿的顏色優先
  return [...out.entries()].filter(([n])=>!hid.includes(n)).sort((a,b)=>b[1].ts-a[1].ts).map(([n,v])=>({name:n,color:v.color,last:''}));
}

/* 拖曳排序：按住左邊把手上下移動，放開就儲存 */
function startDrag(e,row,box){
  if(e.button!==undefined&&e.button>0)return;
  e.preventDefault();
  const grip=e.currentTarget;
  try{grip.setPointerCapture(e.pointerId)}catch(_){}
  const startRect=row.getBoundingClientRect();
  const grab=e.clientY-startRect.top;
  let ty=0,pointerY=e.clientY,pointerX=e.clientX,raf=0,active=true;window.__dragging=true;
  row.classList.add('dragging');
  function update(){
    const natural=row.getBoundingClientRect().top-ty;
    ty=(pointerY-grab)-natural;
    row.style.transform='translateY('+ty+'px)';
    for(let guard=0;guard<60;guard++){
      const rc=row.getBoundingClientRect(),center=rc.top+rc.height/2;
      const prev=row.previousElementSibling,next=row.nextElementSibling;
      let moved=false;
      if(prev){const pr=prev.getBoundingClientRect();if(center<pr.top+pr.height/2){box.insertBefore(prev,row.nextSibling);moved=true}}
      if(!moved&&next){const nr=next.getBoundingClientRect();if(center>nr.top+nr.height/2){box.insertBefore(next,row);moved=true}}
      if(!moved)break;
      const nat=row.getBoundingClientRect().top-ty;ty=(pointerY-grab)-nat;row.style.transform='translateY('+ty+'px)';
    }
  }
  function loop(){
    if(!active)return;
    const vh=window.innerHeight;let dy=0;
    const tb=$('btnTop'),tr=tb.getBoundingClientRect();
    const onTop=tb.classList.contains('show')&&pointerX>tr.left-14&&pointerX<tr.right+14&&pointerY>tr.top-14&&pointerY<tr.bottom+14;
    tb.classList.toggle('hot',onTop);
    if(onTop){dy=-(window.scrollY>0?Math.max(40,Math.min(160,window.scrollY/8)):0)}   // 拖到 Top 上面：一直往上捲到頂（拖著的品項跟著走）
    else if(pointerY<100)dy=-Math.ceil((100-pointerY)/6);else if(pointerY>vh-120)dy=Math.ceil((pointerY-(vh-120))/6);
    if(dy){window.scrollBy(0,dy);update()}
    raf=requestAnimationFrame(loop);
  }
  const pid=e.pointerId,noScroll=ev=>ev.preventDefault();
  const mv=ev=>{if(ev.pointerId!==pid)return;pointerY=ev.clientY;pointerX=ev.clientX;update()};
  const up=ev=>{if(ev.pointerId===pid)end()};
  const hide=()=>{if(document.hidden)end()};
  const end=()=>{
    if(!active)return;active=false;cancelAnimationFrame(raf);window.__dragging=false;$('btnTop').classList.remove('hot');window.dispatchEvent(new Event('scroll'));
    window.removeEventListener('pointermove',mv);window.removeEventListener('pointerup',up);window.removeEventListener('pointercancel',up);
    window.removeEventListener('blur',end);document.removeEventListener('visibilitychange',hide);document.removeEventListener('touchmove',noScroll);
    grip.removeEventListener('lostpointercapture',lost);
    try{grip.releasePointerCapture(pid)}catch(_){}
    row.classList.remove('dragging');row.style.transform='';
    const order=[...box.children].map(x=>x.dataset.id);
    const map=new Map(S.items.map(i=>[i.id,i]));
    const activeOrder=order.map(id=>map.get(id)).filter(Boolean);
    let ai=0;const next=S.items.map(i=>i.off?i:(activeOrder[ai++]||i));
    activeOrder.forEach(i=>{if(!next.includes(i))next.push(i)});
    const changed=next.some((i,k)=>i!==S.items[k]);
    if(changed){S.items=next;saveItems();renderChips();renderItems();if(!$('tab-history').classList.contains('hidden'))renderHistory()}
    renderItemEditor();
  };
  const lost=()=>{};   // 不依賴 pointer capture：事件改掛在 window，即使捕捉被釋放也不會卡住
  window.addEventListener('pointermove',mv);window.addEventListener('pointerup',up);window.addEventListener('pointercancel',up);
  window.addEventListener('blur',end);document.addEventListener('visibilitychange',hide);
  document.addEventListener('touchmove',noScroll,{passive:false});
  grip.addEventListener('lostpointercapture',lost);
  raf=requestAnimationFrame(loop);
}

let updChecking=false;
const hashStr=t=>{let h=5381;for(let i=0;i<t.length;i++)h=((h<<5)+h+t.charCodeAt(i))|0;return t.length+':'+h};
async function checkUpdate(manual){
  if(updChecking)return;updChecking=true;
  try{
    const base=location.href.split('#')[0].split('?')[0];
    // 手機目前使用的（快取）版本 vs 網站上的最新版本，內容只要有任何不同就更新
    const [a,b]=await Promise.all([
      fetch(base,{cache:'force-cache'}).then(r=>r.text()),
      fetch(base+'?_='+Date.now(),{cache:'no-store'}).then(r=>r.text())
    ]);
    if(hashStr(a)!==hashStr(b)){
      const last=+sessionStorage.getItem('updAt')||0;
      if(!manual&&Date.now()-last<30000)return;
      sessionStorage.setItem('updAt',Date.now());
      try{if(window.caches){const ks=await caches.keys();await Promise.all(ks.map(k=>caches.delete(k)))}}catch(e){}
      try{const rs=navigator.serviceWorker&&await navigator.serviceWorker.getRegistrations();rs&&rs.forEach(r=>r.unregister())}catch(e){}
      await fetch(base,{cache:'reload'}).catch(()=>{});
      setTimeout(()=>location.reload(),500);return;
    }
  }catch(e){}
  finally{updChecking=false}
}
document.addEventListener('visibilitychange',()=>{if(!document.hidden)checkUpdate(false)});
window.addEventListener('pageshow',e=>{if(e.persisted)checkUpdate(false)});
setTimeout(()=>checkUpdate(false),1500);
})();
</script>
